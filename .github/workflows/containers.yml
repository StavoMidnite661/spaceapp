name: Container matrix

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "!packages/run-spaceapp/**"
      - "deploy/docker/**"
      - "starter-memory/**"
      - "Dockerfile"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "!packages/run-spaceapp/**"
      - "deploy/docker/**"
      - "starter-memory/**"
      - "Dockerfile"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }} / linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - core
          - browser
          - cli
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: spaceapp-ci:${{ matrix.target }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Enforce container size budget
        run: >-
          node scripts/container-image-size-budget.mjs
          --target "${{ matrix.target }}"
          --image "spaceapp-ci:${{ matrix.target }}-${{ matrix.arch }}"

      - name: Smoke check running container
        run: |
          case "${{ matrix.target }}" in
            core)
              mkdir -p /tmp/core-secrets
              printf 'postgres://spaceapp:spaceapp@postgres:5432/spaceapp\n' > /tmp/core-secrets/database-url
              printf 'test-secret-not-for-production\n' > /tmp/core-secrets/session-secret
              printf 'test-setup-token-not-for-production\n' > /tmp/core-secrets/setup-token
              docker run --rm -d --name smoke-postgres \
                -e POSTGRES_USER=spaceapp -e POSTGRES_PASSWORD=spaceapp -e POSTGRES_DB=spaceapp \
                pgvector/pgvector:0.8.3-pg17-trixie >/dev/null
              docker run --rm -d --name spaceapp-ci-core-smoke \
                --link smoke-postgres:postgres \
                -v /tmp/core-secrets:/run/secrets:ro \
                spaceapp-ci:core-${{ matrix.arch }} >/dev/null
              for i in $(seq 1 30); do
                if docker exec spaceapp-ci-core-smoke \
                  node -e "fetch('http://127.0.0.1:4911/readyz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))" 2>/dev/null; then
                  echo "core smoke check passed"
                  docker stop spaceapp-ci-core-smoke smoke-postgres >/dev/null 2>&1 || true
                  exit 0
                fi
                sleep 2
              done
              echo "core smoke check failed"
              docker logs spaceapp-ci-core-smoke 2>&1 || true
              docker stop spaceapp-ci-core-smoke smoke-postgres >/dev/null 2>&1 || true
              exit 1
              ;;
            cli)
              docker run --rm -d --name spaceapp-ci-cli-smoke \
                -e SPACE_CLI_ENABLED=true \
                spaceapp-ci:cli-${{ matrix.arch }} >/dev/null
              sleep 5
              if docker inspect spaceapp-ci-cli-smoke --format='{{.State.Running}}' 2>/dev/null | grep -q true; then
                echo "cli smoke check passed"
                docker stop spaceapp-ci-cli-smoke >/dev/null 2>&1 || true
                exit 0
              fi
              echo "cli smoke check failed"
              docker logs spaceapp-ci-cli-smoke 2>&1 || true
              docker stop spaceapp-ci-cli-smoke >/dev/null 2>&1 || true
              exit 1
              ;;
            browser)
              docker run --rm -d --name spaceapp-ci-browser-smoke \
                spaceapp-ci:browser-${{ matrix.arch }} >/dev/null
              sleep 8
              if docker inspect spaceapp-ci-browser-smoke --format='{{.State.Running}}' 2>/dev/null | grep -q true; then
                echo "browser smoke check passed"
                docker stop spaceapp-ci-browser-smoke >/dev/null 2>&1 || true
                exit 0
              fi
              echo "browser smoke check failed"
              docker logs spaceapp-ci-browser-smoke 2>&1 || true
              docker stop spaceapp-ci-browser-smoke >/dev/null 2>&1 || true
              exit 1
              ;;
          esac
